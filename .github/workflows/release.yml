name: Publish Release

on:
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Fabric JAR
        run: ./gradlew --no-daemon clean build

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraftVersion=//p' gradle.properties)"
          mod_id="$(sed -n 's/^modId=//p' gradle.properties)"

          jar="build/libs/${mod_id}-fabric-${minecraft_version}-${version}.jar"
          if [[ ! -s "$jar" ]]; then
            echo "::error::Expected Fabric JAR was not built at $jar"
            exit 1
          fi

          tag="v${version}-fabric-${minecraft_version}"
          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}")" &&
             [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to a different commit"
            exit 1
          fi

          gh release create "$tag" "$jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Enderman Overhaul ${version} (Fabric ${minecraft_version})" \
            --notes-file changelog.md
